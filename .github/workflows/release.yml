name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege at the top level; the job widens only what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # gh release create + upload assets
      id-token: write       # keyless cosign signing + provenance OIDC token
      attestations: write   # actions/attest-build-provenance
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening); the trailing
      # comment records the human-readable version the SHA corresponds to.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so `git describe --tags` resolves the pushed tag into
          # the version baked into the binary.
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.23'

      - run: make test
      - run: make release   # cross-compiled binaries + checksums.txt into dist/

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/agentbox.spdx.json
          # The release upload below attaches it; no separate handling needed.
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums (keyless / Sigstore)
        env:
          COSIGN_YES: "true"
        # checksums.txt covers every binary by SHA-256, so one signature over it
        # transitively authenticates all release artifacts.
        run: |
          cosign sign-blob \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: 'dist/agentbox_*'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
