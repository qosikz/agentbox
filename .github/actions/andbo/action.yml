name: Andbo
description: Run an AI coding agent safely in an Andbo workspace and upload the session.

inputs:
  task:
    description: Task for the agent.
    required: true
  agent:
    description: Adapter to use (custom, claude, codex, gemini, goose, opencode).
    required: false
    default: custom
  policy:
    description: Policy file path.
    required: false
    default: andbo.yaml
  dry_run:
    description: Plan only; do not execute the agent. Strongly recommended for fork PRs.
    required: false
    default: "true"
  open_pr:
    description: Open a pull request with the changes (requires a write token and the gh CLI).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Go
      # Pinned to a commit SHA (supply-chain hardening); comment = version.
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: "1.23"

    - name: Build Andbo
      shell: bash
      run: |
        # During the preview the module is unpublished, so build from this repo.
        # Once published you can replace this with:
        #   go install github.com/qosikz/andbo/cmd/andbo@latest
        go build -o "$RUNNER_TEMP/andbo" ./cmd/andbo

    - name: Run Andbo
      shell: bash
      env:
        ANDBO_TASK: ${{ inputs.task }}
      run: |
        ARGS=(run "$ANDBO_TASK" --policy "${{ inputs.policy }}" --agent "${{ inputs.agent }}")
        if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
        if [ "${{ inputs.open_pr }}" = "true" ]; then ARGS+=(--open-pr --commit); fi
        # CI is non-interactive: --yes-unsafe is required only if the policy enables
        # an unsafe mode. Safe policies never trip it.
        ARGS+=(--yes-unsafe)
        "$RUNNER_TEMP/andbo" "${ARGS[@]}"

    - name: Upload Andbo session
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: andbo-session
        path: .andbo/sessions/
        if-no-files-found: ignore
