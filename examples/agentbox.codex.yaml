# AgentBox policy — run the OpenAI Codex CLI as a baked-in, sandboxed agent.
#
# ILLUSTRATIVE template, not a verified turnkey run: Codex's auth and its own
# sandbox behavior are provider-specific and version-dependent. The VERIFIED
# zero-cost path is the stub (examples/agentbox.stub.yaml). Treat this as a
# starting point and consult the Codex docs for your version.
#
#   docker build -t agentbox/codex:latest -f examples/agents/codex.Dockerfile examples/agents
#   export CODEX_API_KEY=sk-...            # see note below
#   agentbox run "add a test for parseConfig" --policy examples/agentbox.codex.yaml
#
# No unsafe flag needed: network.mode=allowlist is ENFORCED (per-run isolated
# network + egress proxy), so the agent can reach its model API and nothing
# else. Every allowed/denied connection is recorded in the session.

runtime:
  isolation: container
  engine: docker
  image: agentbox/codex:latest          # the codex CLI is baked into this image
  cleanup: true

agent:
  default: codex                        # runs: codex exec --sandbox workspace-write "{{ task }}"

network:
  mode: allowlist                       # enforced: HTTP(S) to these domains only
  allow:
    - api.openai.com                    # model API (codex exec with CODEX_API_KEY)
    # Add registries only if the TASK needs them (keep the list minimal):
    # - registry.npmjs.org
    # - pypi.org
    # - files.pythonhosted.org

secrets:
  mode: explicit
  # Inject the key at runtime (never baked into the image) and redact it from
  # logs. `codex exec` reads CODEX_API_KEY for a single non-interactive run
  # (per the Codex docs and internal/adapters/codex.go). CODEX_API_KEY is not in
  # the secure-default deny list, so no deny override is needed here.
  allow:
    - CODEX_API_KEY
  redact_patterns:
    - "sk-[A-Za-z0-9_-]+"

# Two gotchas you may hit with the default `agent.default: codex` path:
#   1. Codex ships its own Landlock/Seatbelt sandbox, which can CONFLICT with
#      AgentBox's container. Inside AgentBox the container IS the boundary, so
#      you may need to bypass Codex's sandbox (see the custom block below).
#   2. If your Codex version prefers ChatGPT login over the API key, you may
#      need `--config preferred_auth_method=apikey`.
# The custom adapter lets you set both explicitly:
#
# agent:
#   default: custom
#   custom:
#     command: codex
#     args:
#       - "exec"
#       - "--dangerously-bypass-approvals-and-sandbox"
#       - "{{ task }}"
